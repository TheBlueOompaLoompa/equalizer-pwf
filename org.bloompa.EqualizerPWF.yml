id: org.bloompa.EqualizerPWF
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: equalizer-pwf
modules:
  - name: wireplumber
    buildsystem: meson
    config-opts:
      - -Dsystemd=disabled
      - -Dintrospection=disabled
      - -Ddoc=disabled
      - -Dmodules=false
      - -Ddaemon=false
      - -Dtools=false
      - -Dtests=false
      - -Ddbus-tests=false
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/pipewire/wireplumber.git
        tag: '0.5.15'
        disable-submodules: false
        post-checkout:
          - rm -f subprojects/lua.wrap
    cleanup:
      - /bin
      - /etc
      - /share
  - name: equalizer-pwf
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DFLATPAK=on
    sources:
      - type: dir
        path: "."
    post-install:
      - install -Dm644 equalizer-pwf.desktop $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
#      - install -Dm644 $FLATPAK_ID.metainfo.xml $FLATPAK_DEST/share/metainfo/$FLATPAK_ID.metainfo.xml
      - install -Dm644 equalizer-pwf.svg $FLATPAK_DEST/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm644 equalizer-pwf-tray.png $FLATPAK_DEST/share/icons/hicolor/128x128/apps/$FLATPAK_ID.png
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # GPU acceleration if needed
  - --device=dri
  # Needs to save files locally
  - --filesystem=home
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.kde.StatusNotifierItem
